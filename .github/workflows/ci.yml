name: CI

on:
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # TODO: use a container with cmake and python?
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python library
        working-directory: python-lib
        run: python -m pip install -e .[dev]

      - name: Install Python tools
        run: python -m pip install -r requirements.txt

      - name: Build and test
        run: cmake --workflow --preset workflow-test

      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: _build/conf-gcc-default/tests/coverage/coverage.xml
          badge: false
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '60 80'

      - name: Write to Job Summary
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

  python_test:
    name: Python Test
    runs-on: ubuntu-latest
    container: python:3.14
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python library
        working-directory: python-lib
        run: python -m pip install -e .[dev]
      
      - name: Run tests
        working-directory: python-lib
        run: python -m pytest

      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: python-lib/coverage.xml
          badge: false
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '60 80'

      - name: Write to Job Summary
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Install Doxygen
        run: sudo apt-get install doxygen

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python library
        working-directory: python-lib
        run: python -m pip install -e .[dev]

      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt

      - name: Build documentation
        run: cmake --workflow --preset workflow-docs

