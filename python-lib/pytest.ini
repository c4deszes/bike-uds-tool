[pytest]
# pytest.ini
# This file is used to configure pytest settings for the project.   
# It can include options such as test paths, markers, and other configurations.
# Example configuration:

testpaths = tests
# Specifies the directory where pytest will look for tests. 

addopts = -v --tb=short --cov=line_uds --cov-report=xml:coverage.xml --cov-report=html:htmlcov

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = report.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
